<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="面向人工智能专业的职业生涯规划学习实践工作台：岗位地图、能力自评、学习路线、实践项目与求职准备。">
<title>人工智能专业 · 职业生涯规划学习实践工作台</title>
<script>
/* 尽早确定主题，避免刷新时闪白 */
(function(){try{var s=JSON.parse(localStorage.getItem('ai-career-workbench-v1')||'{}');
var t=(s&&s.theme)||'auto';var d=t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f4f5fa; --bg2:#ffffff; --card:#ffffff; --soft:#f7f8fc;
  --border:#e5e7f0; --border2:#eef0f7;
  --text:#141827; --text2:#3d4457; --dim:#6b7385; --faint:#9aa1b4;
  --brand:#4f46e5; --brand2:#7c3aed; --brand-soft:#eef0ff;
  --ok:#0ea371; --ok-soft:#e7f7f1; --warn:#d97706; --warn-soft:#fdf3e3;
  --danger:#dc2626; --danger-soft:#fdecec;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px -18px rgba(16,24,40,.35);
  --shadow-lg:0 24px 60px -28px rgba(16,24,40,.45);
  --r:16px; --r-sm:10px; --r-xs:8px;
  --nav-w:248px;
}
html[data-theme="dark"]{
  --bg:#0d0f18; --bg2:#131624; --card:#151827; --soft:#1a1e2f;
  --border:#262b40; --border2:#1f2437;
  --text:#eef0f7; --text2:#c7ccdb; --dim:#98a0b4; --faint:#6f778c;
  --brand:#7c8cff; --brand2:#a78bfa; --brand-soft:#1e2140;
  --ok:#34d399; --ok-soft:#122a24; --warn:#fbbf24; --warn-soft:#2c2413;
  --danger:#f87171; --danger-soft:#2d1618;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -20px rgba(0,0,0,.9);
  --shadow-lg:0 28px 70px -30px rgba(0,0,0,.95);
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,ul,ol{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.skip{position:absolute;left:-9999px}
.skip:focus{left:8px;top:8px;z-index:99;background:var(--card);padding:8px 12px;border-radius:8px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- 布局 ---------- */
.app{display:block;min-height:100vh}

/* ---------- 侧边 / 顶部导航 ---------- */
.nav{
  position:sticky;top:0;z-index:30;
  background:var(--bg2);
  background:color-mix(in srgb,var(--bg2) 88%,transparent);
  backdrop-filter:saturate(160%) blur(12px);
  -webkit-backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--border);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom)*0);
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  font-weight:800;font-size:13px;letter-spacing:.5px;box-shadow:var(--shadow);
}
.brand-txt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand-txt strong{font-size:14px;white-space:nowrap}
.brand-txt span{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-list{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.nav-list::-webkit-scrollbar{display:none}
.nav-item{
  flex:none;display:flex;align-items:center;gap:7px;white-space:nowrap;
  padding:7px 12px;border-radius:999px;border:1px solid var(--border);
  background:var(--card);color:var(--text2);font-size:13.5px;transition:.15s;
}
.nav-item .ico{font-size:14px}
.nav-item:hover{border-color:var(--brand);color:var(--text)}
.nav-item.on{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;box-shadow:var(--shadow)}
.nav-foot{display:none}

.main{min-width:0;padding:16px 14px calc(40px + env(safe-area-inset-bottom))}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.topbar h1{font-size:20px;letter-spacing:-.2px}
.topbar p{font-size:12.5px;color:var(--dim)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  padding:8px 13px;border-radius:var(--r-sm);border:1px solid var(--border);
  background:var(--card);color:var(--text2);font-size:13px;transition:.15s;
}
.btn:hover{border-color:var(--brand);color:var(--text)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;box-shadow:var(--shadow)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:var(--r-xs)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.block{width:100%}

/* ---------- 视图 ---------- */
.view{display:none;animation:in .22s ease}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:12px}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g-2{grid-template-columns:1fr}
.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow);min-width:0;
}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-size:15px}
.card-h .sub{font-size:12px;color:var(--dim)}
.sec-title{font-size:16px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:0}
.sec-title small{font-size:12px;color:var(--dim);font-weight:400}

/* ---------- 总览 ---------- */
.hero{
  border-radius:var(--r);padding:20px;color:#fff;
  background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#a855f7);
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.13)}
.hero-grid{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;position:relative;z-index:1}
.hero h2{font-size:20px;margin-bottom:4px}
.hero p{font-size:13px;opacity:.9;max-width:52ch}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hero .chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:3px 10px;border-radius:999px;font-size:12px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .val b{font-size:26px;display:block}
.ring .val span{font-size:11px;opacity:.85}

.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.stat .v{font-size:22px;font-weight:700;margin:2px 0 6px;letter-spacing:-.5px}
.stat .v em{font-size:12px;font-weight:500;color:var(--faint);font-style:normal;margin-left:3px}

.bar{height:6px;border-radius:999px;background:var(--border2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s}
.bar.ok > i{background:linear-gradient(90deg,#10b981,#34d399)}
.bar.warn > i{background:linear-gradient(90deg,#f59e0b,#fbbf24)}

.advice{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--border)}
.advice:last-child{border-bottom:none;padding-bottom:0}
.advice .num{width:22px;height:22px;flex:none;border-radius:7px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:700}
.advice b{font-size:13.5px;display:block}
.advice p{font-size:12.5px;color:var(--dim)}

/* 打卡热力图 */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;max-width:340px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--border2);display:block}
.heat i.on{background:var(--brand)}

/* ---------- 岗位地图 ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:1 1 200px;min-width:0;padding:8px 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card)}
.pill{padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12.5px;color:var(--text2)}
.pill.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.role{cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px}
.role:hover{transform:translateY(-2px);border-color:var(--brand)}
.role.target{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.role .top{display:flex;gap:10px;align-items:flex-start}
.role .ico{width:38px;height:38px;flex:none;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:19px}
.role h4{font-size:14.5px}
.role .meta{font-size:11.5px;color:var(--dim)}
.role .desc{font-size:12.5px;color:var(--text2)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--dim);border:1px solid var(--border2)}
.tag.b{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.badge.gray{background:var(--soft);color:var(--dim)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}

.dl{display:grid;gap:8px;font-size:13px}
.dl .row{display:grid;grid-template-columns:76px 1fr;gap:10px}
.dl .row > dt{color:var(--dim);font-size:12.5px}
.dl .row > dd{margin:0;color:var(--text2)}
ul.li{padding-left:18px;font-size:13px;color:var(--text2)}
ul.li li{margin:2px 0}

/* ---------- 能力自评 ---------- */
.radar-wrap{display:flex;justify-content:center;padding:4px 0}
.radar{width:100%;max-width:400px;height:auto}
.skill-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-bottom:1px dashed var(--border)}
.skill-row:last-child{border-bottom:none}
.skill-row b{font-size:13.5px;font-weight:600}
.skill-row .d{font-size:12px;color:var(--dim);grid-column:1/-1}
.skill-row .ctrl{display:flex;align-items:center;gap:10px;grid-row:1;grid-column:2}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:22px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:999px;background:var(--border)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;margin-top:-6px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:5px;border-radius:999px;background:var(--border)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.lvl{font-size:12.5px;color:var(--dim);width:34px;text-align:right}
.gap{font-size:11.5px;padding:1px 7px;border-radius:999px}
.gap.pos{background:var(--ok-soft);color:var(--ok)}
.gap.neg{background:var(--warn-soft);color:var(--warn)}

/* ---------- 学习路线 / 时间轴 ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-node{position:relative;margin-bottom:16px}
.tl-node::before{content:"";position:absolute;left:-23px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--card);border:2px solid var(--brand)}
.tl-node.done::before{background:var(--brand)}
.tl-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:4px}
.tl-head h4{font-size:14.5px}
.tl-head .st{font-size:12px;color:var(--dim)}

.task{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--border);cursor:pointer}
.task:last-child{border-bottom:none}
.box{
  width:19px;height:19px;flex:none;margin-top:2px;border-radius:6px;border:1.6px solid var(--border);
  display:grid;place-items:center;font-size:12px;color:#fff;transition:.15s;background:var(--card);
}
.task.on .box{background:var(--brand);border-color:var(--brand)}
.task.on .t{color:var(--faint);text-decoration:line-through}
.task .t{font-size:13.5px}
.task .s{font-size:12px;color:var(--dim);display:block}

.res{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.res a,.res span{font-size:12px;padding:3px 9px;border-radius:8px;background:var(--soft);border:1px solid var(--border2);color:var(--text2);text-decoration:none}
.res a{color:var(--brand);background:var(--card)}
.res a:hover{border-color:var(--brand);background:var(--brand-soft)}
.res a::after{content:"↗";font-size:10px;margin-left:3px;opacity:.75}

/* ---------- 项目 ---------- */
.proj{display:flex;flex-direction:column;gap:9px}
.proj .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.proj h4{font-size:14.5px}
.proj .week{font-size:11.5px;color:var(--faint);white-space:nowrap}
.proj .fold{border-top:1px dashed var(--border);padding-top:9px;margin-top:2px}
.proj details summary{cursor:pointer;font-size:12.5px;color:var(--brand);list-style:none}
.proj details summary::-webkit-details-marker{display:none}
.proj details summary::before{content:"▸ ";}
.proj details[open] summary::before{content:"▾ ";}
.step{display:flex;gap:8px;font-size:12.5px;color:var(--text2);padding:5px 0;cursor:pointer;align-items:flex-start}
.step.on{color:var(--faint);text-decoration:line-through}

/* ---------- 求职准备 ---------- */
.prep-group{margin-bottom:6px}
.prep-group h4{font-size:13.5px;margin-bottom:6px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.stage{display:grid;gap:4px;padding:11px 13px;border-radius:var(--r-sm);background:var(--soft);border:1px solid var(--border2);margin-bottom:8px}
.stage b{font-size:13.5px}
.stage p{font-size:12.5px;color:var(--dim)}
.stage .when{font-size:11.5px;color:var(--brand);font-weight:600}

/* ---------- 档案 ---------- */
.rec{display:grid;gap:4px;padding:12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--card)}
.rec .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rec b{font-size:14px}
.rec .days{font-size:11.5px;color:var(--dim);margin-left:6px}
.rec .meta{font-size:11.5px;color:var(--brand);font-weight:600;padding:1px 8px;border-radius:999px;background:var(--brand-soft);display:inline-block;width:fit-content}
.field{display:grid;gap:5px;margin-bottom:10px}
.field label{font-size:12.5px;color:var(--dim)}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg2);
}
.field textarea{min-height:74px;resize:vertical}
.form-2{display:grid;grid-template-columns:1fr;gap:10px}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:22px 10px}

/* ---------- 弹层 ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,12,22,.55);backdrop-filter:blur(3px)}
.modal[hidden]{display:none}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);width:min(680px,100%);max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}
.modal-h h3{font-size:15px}
.modal-b{padding:16px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card)}
.modal textarea{width:100%;min-height:200px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;padding:10px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg2)}

.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:80;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow-lg);max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--border);color:var(--faint);font-size:11.5px;text-align:center}
.foot p{margin:2px 0}

/* ---------- 桌面 ---------- */
@media (min-width:900px){
  .app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr)}
  .nav{
    position:sticky;top:0;height:100vh;border-bottom:none;border-right:1px solid var(--border);
    padding:20px 14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;
  }
  .brand{margin-bottom:2px}
  .nav-list{flex-direction:column;overflow:visible;gap:3px}
  .nav-item{border-radius:var(--r-sm);border-color:transparent;background:transparent;padding:9px 12px}
  .nav-item:hover{background:var(--soft)}
  .nav-item.on{box-shadow:none}
  .nav-foot{display:block;margin-top:auto;padding-top:14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--faint)}
  .main{padding:26px 30px 48px}
  .topbar h1{font-size:24px}
  .g-2{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
  .g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .form-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .heat{max-width:none}
}
@media (min-width:1280px){
  .main{padding:30px 40px 60px}
  .view{max-width:1320px}
}
@media print{
  .nav,.topbar .actions,.toast,.modal{display:none!important}
  .app{display:block}
  .view{display:block!important}
  .card{break-inside:avoid;box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#v-dashboard">跳到主内容</a>
<div class="app">
  <aside class="nav">
    <div class="brand">
      <div class="logo">AI</div>
      <div class="brand-txt">
        <strong>职业规划工作台</strong>
        <span>人工智能专业 · 学习与实践</span>
      </div>
    </div>
    <nav class="nav-list" id="navList" aria-label="主导航"></nav>
    <div class="nav-foot">
      <button class="btn ghost sm block" data-act="theme" style="margin-bottom:8px">切换深浅色</button>
      <p>所有数据只保存在本机浏览器，请定期导出备份。</p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="viewTitle">总览</h1>
        <p id="viewSub"></p>
      </div>
      <div class="actions">
        <button class="btn sm" data-act="export">导出备份</button>
        <button class="btn sm" data-act="import">导入备份</button>
        <button class="btn sm danger" data-act="reset">重置</button>
      </div>
    </header>

    { id: 'profile',   icon: '🗂️', label: '我的档案',   title: '我的档案',   sub: '学业信息、经历记录与数据备份' }
  ];

  function defaults() {
    return {
      v: 1, theme: 'auto',
      user: { name: '', school: '', grade: '大三', hours: 10, target: 'llm' },
      // 自评默认全 0，且 skillsSet=false 表示「还没做过自评」。
      // 这样重置后整体进度是真正的 0%，而不会把预填的默认值当成已完成的进度。
      skills: { math: 0, code: 0, ml: 0, dl: 0, data: 0, eng: 0, research: 0, product: 0 },
      skillsSet: false,
      roadmap: {}, projects: {}, prep: {}, records: [], checkins: [],
      ui: { view: 'dashboard', cat: '全部', q: '', level: '全部' }
    };
  }
  var S = defaults();

  function merge(base, o) {
    Object.keys(o || {}).forEach(function (k) {
      var v = o[k];
      if (v && typeof v === 'object' && !Array.isArray(v) &&
          base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
        base[k] = merge(base[k], v);
      } else if (v !== undefined && v !== null) {
        base[k] = v;
      }
    });
    return base;
  }

  function load() {
    var o = null;
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) o = JSON.parse(raw);
    } catch (e) { o = null; /* 读取失败则使用默认值 */ }
    if (o && typeof o === 'object') S = merge(defaults(), o);
    // 兼容旧版本存档：那版没有 skillsSet 标记，且默认预填了自评值。
    // 若存下来的自评值恰好等于旧默认值或全为 0，说明用户从未真正打过分。
    if (o && typeof o === 'object' && o.skillsSet === undefined) {
      var legacy = { math: 2, code: 2, ml: 2, dl: 1, data: 2, eng: 1, research: 1, product: 2 };
      S.skillsSet = Object.keys(legacy).some(function (k) {
        return S.skills[k] !== legacy[k] && S.skills[k] !== 0;
      });
    }
    var h = (location.hash || '').replace('#', '');
    if (h && VIEWS.some(function (v) { return v.id === h; })) S.ui.view = h;
  }

  var storageOK = true;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) {
      if (storageOK) { storageOK = false; toast('浏览器本地存储不可用，本次进度不会被保存'); }
    }
  }

  /* ============================ 工具 ============================ */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function todayKey(d) {
    var t = d || new Date();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }
  function roleOf(id) { return CAREERS.filter(function (c) { return c.id === id; })[0] || null; }
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('on'); }, 2400);
  }

  /* ============================ 进度计算 ============================ */

  function roadStats() {
    var total = 0, done = 0;
    ROADMAP.forEach(function (st) {
      st.items.forEach(function (it, i) {
        total++; if (S.roadmap[st.id + ':' + i]) done++;
      });
    });
    return { total: total, done: done, p: pct(done, total) };
  }
  function stageStats(st) {
    var done = 0;
    st.items.forEach(function (it, i) { if (S.roadmap[st.id + ':' + i]) done++; });
    return { done: done, total: st.items.length, p: pct(done, st.items.length) };
  }
  function projStats() {
    var joined = 0, steps = 0, done = 0;
    PROJECTS.forEach(function (p) {
      var st = S.projects[p.id];
      if (st && st.joined) {
        joined++; steps += p.steps.length;
        p.steps.forEach(function (_, i) { if (st.steps && st.steps[i]) done++; });
      }
    });
    return { joined: joined, steps: steps, done: done, p: pct(done, steps) };
  }
  function prepStats() {
    var total = 0, done = 0;
    PREP.forEach(function (g) {
      g.items.forEach(function (_, i) { total++; if (S.prep[g.id + ':' + i]) done++; });
    });
    return { total: total, done: done, p: pct(done, total) };
  }
  function targetRole() { return roleOf(S.user.target); }
  function skillMatch() {
    var r = targetRole();
    if (!r || !S.skillsSet) return null;   // 还没自评就不算匹配度，避免凭空给出一个分数
    var gapSum = 0;
    DIMS.forEach(function (d) {
      var g = (r.dims[d.k] || 0) - (S.skills[d.k] || 0);
      if (g > 0) gapSum += g;
    });
    return { p: Math.round(100 * (1 - gapSum / (DIMS.length * 5))), gapSum: gapSum };
  }
  function gaps() {
    var r = targetRole();
    return DIMS.map(function (d) {
      var self = S.skills[d.k] || 0, want = r ? (r.dims[d.k] || 0) : 0;
      return { k: d.k, n: d.n, d: d.d, self: self, want: want, gap: want - self };
    }).sort(function (a, b) { return b.gap - a.gap; });
  }
  function overall() {
    var rs = roadStats(), ps = projStats(), qs = prepStats(), ms = skillMatch();
    var parts = [rs.p, ps.p, qs.p];
    if (ms) parts.push(ms.p);
    return Math.round(parts.reduce(function (a, b) { return a + b; }, 0) / parts.length);
  }
  function streak() {
    var set = {}; S.checkins.forEach(function (d) { set[d] = 1; });
    var d = new Date(), n = 0;
    if (!set[todayKey(d)]) d.setDate(d.getDate() - 1); // 今天没打卡则从昨天算起
    while (set[todayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function advice() {
    var out = [];
    var g = gaps(), r = targetRole();
    if (!r) {
      out.push({ t: '先选定一个目标岗位', d: '到岗位地图挑一个方向设为目标，能力自评与建议才会有对照基准。', go: 'careers' });
    }
    if (!S.skillsSet) {
      out.push({
        t: '先完成能力自评',
        d: '到「能力自评」把八项滑杆拖一遍，雷达图和匹配度才会出现。没自评之前，整体进度只统计学习路线、实践项目和求职准备三项。',
        go: 'skills'
      });
    } else {
      g.filter(function (x) { return x.gap > 0; }).slice(0, 2).forEach(function (x) {
        out.push({
          t: '补短板：' + x.n + '（差 ' + x.gap + ' 分）',
          d: x.d + '。建议按学习路线里的对应阶段推进，并用项目把能力做实。',
          go: 'skills'
        });
      });
    }
    var ps = projStats();
    if (ps.joined === 0) {
      var lv = (S.user.grade === '大一' || S.user.grade === '大二') ? '入门' : '进阶';
      var cand = PROJECTS.filter(function (p) { return p.level === lv; })[0];
      if (cand) out.push({ t: '启动第一个实践项目', d: '推荐「' + cand.name + '」，约 ' + cand.weeks + '，能直接产出一份可写进简历的成果。', go: 'projects' });
    } else if (ps.p > 0 && ps.p < 100) {
      out.push({ t: '把手上的项目做完', d: '已加入 ' + ps.joined + ' 个项目，完成度 ' + ps.p + '%。项目做完并写清结论，比多开几个更有价值。', go: 'projects' });
    }
    var map = { '大一': 'y1', '大二': 'y2', '大三': 'y3', '大四': 'y4', '研究生': 'grad' };
    var sid = map[S.user.grade];
    if (sid) {
      var st = ROADMAP.filter(function (x) { return x.id === sid; })[0];
      if (st) {
        var ss = stageStats(st);
        if (ss.p < 100) out.push({ t: '推进当前阶段：' + st.title, d: '该阶段完成 ' + ss.done + '/' + ss.total + ' 项。' + st.goal, go: 'roadmap' });
      }
    }
    var qs = prepStats();
    if (qs.p < 60) out.push({ t: '求职准备完成度 ' + qs.p + '%', d: '面试知识清单还剩 ' + (qs.total - qs.done) + ' 项。八股不是背答案，是把原理讲清楚。', go: 'prep' });
    if (S.records.length === 0) out.push({ t: '建立你的经历档案', d: '把科研、竞赛、实习、项目逐条记录下来，写简历和面试时直接取用。', go: 'profile' });
    if (!out.length) out.push({ t: '状态很好，保持节奏', d: '路线、项目与求职准备都在推进。接下来重点是打磨项目深度与面试表达。', go: 'projects' });
    return out.slice(0, 4);
  }

  /* ============================ 组件 ============================ */

  function ringSVG(p) {
    var r = 52, c = 2 * Math.PI * r;
    return '<svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">' +
      '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="9"></circle>' +
      '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - clamp(p, 0, 100) / 100)).toFixed(1) + '"></circle>' +
      '</svg><div class="val"><div><b>' + p + '%</b><span>整体进度</span></div></div>';
  }

  function bar(p, cls) {
    return '<div class="bar ' + (cls || '') + '"><i style="width:' + clamp(p, 0, 100) + '%"></i></div>';
  }

  function radarSVG() {
    var n = DIMS.length, cx = 180, cy = 162, R = 104, max = 5;
    var self = DIMS.map(function (d) { return S.skills[d.k] || 0; });
    var r = targetRole();
    var want = r ? DIMS.map(function (d) { return r.dims[d.k] || 0; }) : null;

    function pt(i, v) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n, rr = R * v / max;
      return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
    }
    function poly(vals) {
      return vals.map(function (v, i) { var p = pt(i, v); return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
    }
    var s = '<svg class="radar" viewBox="0 0 360 330" role="img" aria-label="八维能力雷达图">';
    [1, 2, 3, 4, 5].forEach(function (lv) {
      s += '<polygon points="' + poly(DIMS.map(function () { return lv; })) + '" fill="none" stroke="var(--border)" stroke-width="1"></polygon>';
    });
    DIMS.forEach(function (d, i) {
      var p = pt(i, max);
      s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="var(--border)" stroke-width="1"></line>';
      var lp = pt(i, max + 0.62);
      var dx = Math.cos(-Math.PI / 2 + i * 2 * Math.PI / n);
      var anchor = Math.abs(dx) < 0.2 ? 'middle' : (dx > 0 ? 'start' : 'end');
      s += '<text x="' + lp[0].toFixed(1) + '" y="' + (lp[1] + 4).toFixed(1) + '" font-size="11.5" fill="var(--dim)" text-anchor="' + anchor + '">' + esc(d.n) + '</text>';
    });
    if (want) {
      s += '<polygon points="' + poly(want) + '" fill="none" stroke="var(--warn)" stroke-width="1.8" stroke-dasharray="5 4"></polygon>';
    }
    s += '<polygon points="' + poly(self) + '" fill="var(--brand)" fill-opacity="0.22" stroke="var(--brand)" stroke-width="2"></polygon>';
    self.forEach(function (v, i) {
      var p = pt(i, v);
      s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="var(--brand)"></circle>';
    });
    s += '</svg>';
    return s;
  }

  function heatHTML() {
    var set = {}; S.checkins.forEach(function (d) { set[d] = 1; });
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var dow = (t.getDay() + 6) % 7;                 // 0 = 周一
    var start = new Date(t); start.setDate(t.getDate() - dow - 49);
    var cells = '';
    for (var i = 0; i < 56; i++) {
      var d = new Date(start); d.setDate(start.getDate() + i);
      var on = !!set[todayKey(d)];
      cells += '<i class="' + (on ? 'on' : '') + '" title="' + todayKey(d) + (on ? ' 已打卡' : '') + '"></i>';
    }
    return '<div class="heat" aria-label="最近八周打卡记录">' + cells + '</div>';
  }

  /* ============================ 视图渲染 ============================ */

  function renderNav() {
    document.getElementById('navList').innerHTML = VIEWS.map(function (v) {
      return '<button class="nav-item ' + (S.ui.view === v.id ? 'on' : '') + '" data-act="go" data-id="' + v.id + '">' +
        '<span class="ico">' + v.icon + '</span>' + v.label + '</button>';
    }).join('');
  }

  function renderTop() {
    var v = VIEWS.filter(function (x) { return x.id === S.ui.view; })[0] || VIEWS[0];
    document.getElementById('viewTitle').textContent = v.title;
    document.getElementById('viewSub').textContent = v.sub;
  }

  function renderDashboard() {
    var ov = overall(), rs = roadStats(), ps = projStats(), qs = prepStats(), ms = skillMatch(), r = targetRole();
    var name = S.user.name ? esc(S.user.name) : '同学';
    var hour = new Date().getHours();
    var greet = hour < 6 ? '夜深了' : hour < 11 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
    var checkedToday = S.checkins.indexOf(todayKey()) >= 0;

    var h = '';
    h += '<div class="hero"><div class="hero-grid"><div style="min-width:0">' +
      '<h2>' + greet + '，' + name + '</h2>' +
      '<p>' + (r ? '你当前的目标岗位是 <b>' + esc(r.name) + '</b>。' + esc(r.desc) : '还没有设定目标岗位，去「岗位地图」挑一个方向吧。') + '</p>' +
      '<div class="chips">' +
        '<span class="chip">🎓 ' + esc(S.user.grade) + (S.user.school ? ' · ' + esc(S.user.school) : '') + '</span>' +
        '<span class="chip">⏱ 每周可投入 ' + esc(S.user.hours) + ' 小时</span>' +
        '<span class="chip">🔥 连续打卡 ' + streak() + ' 天</span>' +
        (ms ? '<span class="chip">🎯 能力匹配 ' + ms.p + '%</span>' : '') +
      '</div></div>' +
      '<div class="ring">' + ringSVG(ov) + '</div>' +
      '</div></div>';

    h += '<h3 class="sec-title">进度看板 <small>按已参与的项平均得到整体进度</small></h3><div class="grid g-4">';
    h += statCard('🗺️ 学习路线', rs.p + '%', rs.done + ' / ' + rs.total + ' 项任务', rs.p);
    h += statCard('🧪 实践项目', ps.p + '%', ps.joined ? ps.joined + ' 个项目 · ' + ps.done + ' / ' + ps.steps + ' 步' : '尚未加入项目', ps.p);
    h += statCard('🎤 求职准备', qs.p + '%', qs.done + ' / ' + qs.total + ' 项', qs.p);
    h += statCard('🎯 能力匹配', ms ? ms.p + '%' : '待自评',
      ms ? '与目标岗位的差距合计 ' + ms.gapSum + ' 分' : '在「能力自评」拖动滑杆后显示', ms ? ms.p : 0);
    h += '</div>';

    h += '<div class="grid g-2" style="margin-top:12px">';
    h += '<div class="card"><div class="card-h"><h3>下一步建议</h3><span class="sub">根据你的自评与进度自动生成</span></div>' +
      advice().map(function (a, i) {
        return '<div class="advice"><div class="num">' + (i + 1) + '</div><div><b>' + esc(a.t) + '</b><p>' + esc(a.d) + '</p>' +
          '<button class="btn sm" data-act="go" data-id="' + a.go + '" style="margin-top:6px">去处理</button></div></div>';
      }).join('') + '</div>';

    h += '<div class="card"><div class="card-h"><h3>学习打卡</h3><span class="sub">最近 8 周</span></div>' +
      '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px">' +
      '<div><div class="v" style="font-size:22px;font-weight:700">' + streak() + ' <em style="font-size:12px;color:var(--faint);font-style:normal">天</em></div><div style="font-size:12px;color:var(--dim)">当前连续</div></div>' +
      '<div><div class="v" style="font-size:22px;font-weight:700">' + S.checkins.length + ' <em style="font-size:12px;color:var(--faint);font-style:normal">天</em></div><div style="font-size:12px;color:var(--dim)">累计打卡</div></div>' +
      '<button class="btn ' + (checkedToday ? '' : 'primary') + '" data-act="checkin">' + (checkedToday ? '✓ 今日已打卡' : '今日打卡') + '</button>' +
      '</div>' + heatHTML() +
      '<p style="font-size:12px;color:var(--dim);margin-top:10px">打卡只是提醒自己保持节奏，别为了连续天数做无意义的签到。</p></div>';
    h += '</div>';

    if (r) {
      h += '<h3 class="sec-title">目标岗位速览</h3><div class="card">' +
        '<div class="card-h"><div style="display:flex;gap:10px;align-items:center">' +
        '<div class="role-ico" style="width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:19px">' + r.icon + '</div>' +
        '<div><h3>' + esc(r.name) + '</h3><span class="sub">' + esc(r.cat) + ' · 参考月薪 ' + esc(r.salary) + '</span></div></div>' +
        '<button class="btn sm" data-act="role" data-id="' + r.id + '">查看完整要求</button></div>' +
        '<ul class="li">' + r.must.slice(0, 4).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    }

    document.getElementById('v-dashboard').innerHTML = h;
  }

  function statCard(k, v, sub, p) {
    return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + '</div>' + bar(p) +
      '<div style="font-size:12px;color:var(--dim);margin-top:6px">' + sub + '</div></div>';
  }

  function roleCard(c) {
    var on = S.user.target === c.id;
    return '<article class="card role' + (on ? ' target' : '') + '" data-act="role" data-id="' + c.id + '" tabindex="0" role="button">' +
      '<div class="top"><div class="ico">' + c.icon + '</div><div style="min-width:0">' +
      '<h4>' + esc(c.name) + (on ? ' <span class="badge">目标</span>' : '') + '</h4>' +
      '<div class="meta">' + esc(c.cat) + ' · ' + esc(c.salary) + '</div></div></div>' +
      '<p class="desc">' + esc(c.desc) + '</p>' +
      '<div class="tags">' + c.must.slice(0, 3).map(function (x) { return '<span class="tag">' + esc(x) + '</span>'; }).join('') + '</div>' +
      '</article>';
  }

  function careerGrid() {
    var q = (S.ui.q || '').trim().toLowerCase();
    var cat = S.ui.cat || '全部';
    var list = CAREERS.filter(function (c) {
      if (cat !== '全部' && c.cat !== cat) return false;
      if (!q) return true;
      var hay = (c.name + c.desc + c.must.join('') + c.plus.join('') + c.company + c.cat).toLowerCase();
      return hay.indexOf(q) >= 0;
    });
    if (!list.length) return '<div class="card empty">没有匹配的岗位，换个关键词试试。</div>';
    return '<div class="grid g-auto">' + list.map(roleCard).join('') + '</div>';
  }

  function renderCareers() {
    document.getElementById('v-careers').innerHTML =
      '<div class="filters">' +
      '<input class="search" type="search" placeholder="搜索岗位、技能或公司…" value="' + esc(S.ui.q || '') + '" data-act="search" aria-label="搜索岗位">' +
      CATS.map(function (c) { return '<button class="pill ' + (S.ui.cat === c ? 'on' : '') + '" data-act="cat" data-id="' + c + '">' + c + '</button>'; }).join('') +
      '</div><div id="careerGrid">' + careerGrid() + '</div>' +
      '<p style="font-size:12px;color:var(--dim);margin-top:14px">薪资为公开量级参考（一线城市校招），随年份、公司、城市与个人水平波动较大，请以当年招聘公告为准。</p>';
  }
  function refreshCareerGrid() {
    var g = document.getElementById('careerGrid');
    if (g) g.innerHTML = careerGrid();
  }

  function roleModal(id) {
    var c = roleOf(id); if (!c) return;
    var rows = [

  function show(id) {
    VIEWS.forEach(function (v) {
      var el = document.getElementById('v-' + v.id);
      if (el) el.classList.toggle('on', v.id === id);
    });
    S.ui.view = id;
    renderNav(); renderTop();
    if (location.hash !== '#' + id) {

  /* ============================ 弹层 ============================ */

  var modalHandlers = {};
  function openModal(title, body, buttons) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modalFoot').innerHTML = (buttons || []).map(function (b, i) {
      return '<button class="' + (b.cls || 'btn sm') + '" data-midx="' + i + '">' + esc(b.label) + '</button>';
    }).join('');
    document.getElementById('modalFoot')._btns = buttons || [];
    document.getElementById('modal').hidden = false;
  }
  function closeModal() {
    document.getElementById('modal').hidden = true;
    document.getElementById('modalBody').innerHTML = '';
    document.getElementById('modalFoot').innerHTML = '';
  }

  /* ============================ 交互 ============================ */

  function toggleMap(obj, key) { if (obj[key]) delete obj[key]; else obj[key] = true; }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-midx]');
    if (!t) return;

    if (t.hasAttribute('data-midx')) {
      var btns = document.getElementById('modalFoot')._btns || [];
      var b = btns[+t.getAttribute('data-midx')];
      if (b) {
        if (b.act) b.act();
        if (b.mact === 'setTarget') {
          S.user.target = b.arg; save(); closeModal();
          toast('已把「' + (roleOf(b.arg) || {}).name + '」设为目标岗位');
          render();
        }
      } else closeModal();
      return;
    }

    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    switch (act) {
      case 'go': show(id); break;

      case 'theme': {
        var order = ['auto', 'light', 'dark'];
        S.theme = order[(order.indexOf(S.theme) + 1) % 3];
        applyTheme(); save();
        toast('主题：' + ({ auto: '跟随系统', light: '浅色', dark: '深色' })[S.theme]);
        break;
      }

      case 'cat': S.ui.cat = id; save(); renderCareers(); break;
      case 'level': S.ui.level = id; save(); renderProjects(); break;

      case 'role': roleModal(id); break;

      case 'road': {
        var k = id; toggleMap(S.roadmap, k); save();
        var on = !!S.roadmap[k];
        t.classList.toggle('on', on);
        t.setAttribute('aria-checked', String(on));
        t.querySelector('.box').textContent = on ? '✓' : '';
        renderDashboard();
        break;
      }

      case 'prep': {
        toggleMap(S.prep, id); save();
        var on2 = !!S.prep[id];
        t.classList.toggle('on', on2);
        t.setAttribute('aria-checked', String(on2));
        t.querySelector('.box').textContent = on2 ? '✓' : '';
        renderDashboard();
        break;
      }

      case 'join': {
        var pid = t.getAttribute('data-pid');
        var st = S.projects[pid] || (S.projects[pid] = { joined: false, steps: {} });
        st.joined = !st.joined;
        save(); renderProjects();
        toast(st.joined ? '已加入项目，按步骤推进吧' : '已移出我的项目');
        break;
      }

      case 'step': {
        var pid2 = t.getAttribute('data-pid'), i = t.getAttribute('data-i');
        var p = S.projects[pid2] || (S.projects[pid2] = { joined: true, steps: {} });
        var s2 = p.steps || (p.steps = {});
        if (s2[i]) delete s2[i]; else s2[i] = true;
        save(); renderProjects();
        break;
      }

      case 'checkin': {
        var k2 = todayKey(), ix = S.checkins.indexOf(k2);
        if (ix >= 0) { S.checkins.splice(ix, 1); toast('已取消今日打卡'); }
        else { S.checkins.push(k2); toast('打卡成功，连续 ' + (streak() + 1) + ' 天'); }
        save(); renderDashboard();
        break;
      }

      case 'user': break; // 由 change 事件处理

      case 'recAdd': {
        var title = (document.getElementById('recTitle').value || '').trim();
        if (!title) { toast('请先填写经历标题'); break; }
        S.records.unshift({
          id: 'r' + Date.now(),
          type: document.getElementById('recType').value,
          time: (document.getElementById('recTime').value || '').trim(),
          title: title,
          skill: (document.getElementById('recSkill').value || '').trim(),
          desc: (document.getElementById('recDesc').value || '').trim()
        });
        save(); renderProfile(); renderDashboard();
        toast('已添加经历');
        break;
      }

      case 'recDel': {
        S.records = S.records.filter(function (r) { return r.id !== id; });
        save(); renderProfile(); renderDashboard();
        break;
      }

      case 'export': doExport(); break;
      case 'import': doImport(); break;

      case 'reset': {
        openModal('清空所有数据', '<p style="font-size:13.5px;color:var(--text2)">这会删除本机保存的全部进度：路线勾选、项目进度、面试清单、能力自评、经历记录与打卡记录，并回到全新状态（整体进度归零）。该操作不可撤销，建议先导出备份。</p>',
          [{ label: '取消', cls: 'btn sm' },
           { label: '确认清空', cls: 'btn danger sm', act: function () {
              S = defaults(); applyTheme(); save(); closeModal(); render(); toast('已清空');
            } }]);
        break;
      }

      case 'modal-close': closeModal(); break;
    }
  });

  var saveTimer;
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute('data-act') === 'search') {
      S.ui.q = t.value; refreshCareerGrid();
      clearTimeout(saveTimer); saveTimer = setTimeout(save, 600);
      return;
    }
    if (t.getAttribute && t.getAttribute('data-act') === 'user') {
      S.user[t.getAttribute('data-k')] = t.value;
      clearTimeout(saveTimer); saveTimer = setTimeout(save, 600);
      return;
    }
    if (t.getAttribute && t.getAttribute('data-act') === 'skill') {
      var k = t.getAttribute('data-k'), v = +t.value;
      S.skills[k] = v;
      // 第一次拖动滑杆即视为「已自评」，此时才把匹配度纳入整体进度
      if (!S.skillsSet) {
        S.skillsSet = true;
        var hint = document.getElementById('skillHint');
        if (hint) hint.parentNode.removeChild(hint);
      }
      var row = t.closest('.skill-row');
      if (row) {
        row.querySelector('.lvl').textContent = v + ' · ' + LEVELS[v];
        var g = row.querySelector('.gap');
        var r = targetRole();
        if (g && r) {
          var want = r.dims[k] || 0, d = want - v;
          g.className = 'gap ' + (d > 0 ? 'neg' : 'pos');
          g.textContent = d > 0 ? '差 ' + d : '达标';
        }
      }
      clearTimeout(saveTimer); saveTimer = setTimeout(save, 400);
    }
  });

  // 下拉框与单选类表单；滑杆松手后重算匹配度与整体进度
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t.getAttribute) return;
    var act = t.getAttribute('data-act');
    if (act === 'user') {
      S.user[t.getAttribute('data-k')] = t.value;
      save(); render();
    } else if (act === 'skill') {
      save(); renderSkills(); renderDashboard();
    }
  });

  // 键盘可达性：回车/空格触发卡片与勾选项
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var t = e.target.closest && e.target.closest('[data-act][tabindex]');
    if (!t) return;
    e.preventDefault(); t.click();
  });

  document.getElementById('modal').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  /* ============================ 导入导出 ============================ */

  function stamp() {
    var d = new Date();
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') +
      '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
  }

  function doExport() {
    var text = JSON.stringify(S, null, 2);
    var name = 'ai-career-backup-' + stamp() + '.json';
    var tip = '';
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      tip = '<p style="font-size:12.5px;color:var(--ok);margin-bottom:10px">✅ 已尝试下载 ' + name + '。若没有弹出下载（部分手机浏览器会拦截），请复制下面的内容自行保存。</p>';
    } catch (err) {
      tip = '<p style="font-size:12.5px;color:var(--warn);margin-bottom:10px">当前环境不支持直接下载，请复制下面的内容保存为 .json 文件。</p>';
    }
    openModal('导出备份',
      tip + '<textarea readonly onclick="this.select()">' + esc(text) + '</textarea>' +
      '<p style="font-size:12px;color:var(--dim);margin-top:8px">在另一台设备上打开本页面 → 点「导入备份」→ 粘贴内容即可恢复进度。</p>',
      [{ label: '关闭', cls: 'btn sm' }]);
  }

  function doImport() {
    openModal('导入备份',
      '<p style="font-size:12.5px;color:var(--text2);margin-bottom:10px">把之前导出的 JSON 内容粘贴到下面，或选择一个备份文件。导入会覆盖当前进度。</p>' +
      '<textarea id="importText" placeholder=\'粘贴备份内容，形如 {"v":1,"user":{...}}\'></textarea>' +
      '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">' +
      '<button class="btn sm" data-mact-file="1">选择备份文件…</button>' +
      '<button class="btn primary sm" data-mact-apply="1">确认导入</button></div>' +
      '<p id="importMsg" style="font-size:12px;color:var(--warn);margin-top:8px"></p>',
      [{ label: '取消', cls: 'btn sm' }]);

    var body = document.getElementById('modalBody');
    body.querySelector('[data-mact-file]').addEventListener('click', function () {
      document.getElementById('fileInput').click();
    });
    body.querySelector('[data-mact-apply]').addEventListener('click', function () {
      applyImport(document.getElementById('importText').value, document.getElementById('importMsg'));
    });
  }

  function applyImport(text, msgEl) {
    try {
      var o = JSON.parse(text);
      if (!o || typeof o !== 'object' || Array.isArray(o)) throw new Error('格式不正确');
      S = merge(defaults(), o);
      if (!S.ui || !S.ui.view) S.ui = defaults().ui;
      applyTheme(); save(); closeModal(); render();
      toast('导入成功');
    } catch (err) {
      if (msgEl) msgEl.textContent = '导入失败：' + err.message + '。请确认粘贴的是本工作台导出的 JSON。';
      else toast('导入失败：内容不是合法的备份文件');
    }
  }

  document.getElementById('fileInput').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      var msg = document.getElementById('importMsg');
      applyImport(String(fr.result), msg);
    };
    fr.readAsText(f);
    this.value = '';
  });

  /* ============================ 主题 ============================ */

  function applyTheme() {
    var dark = S.theme === 'dark' ||
      (S.theme === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme:dark)');
    var onChange = function () { if (S.theme === 'auto') applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  /* ============================ 启动 ============================ */

  load();
  applyTheme();
  render();
})();
</script>
</body>
</html>
